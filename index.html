<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện khóa học</title>
<style>
  :root{
    --navy:#1f2d4d;
    --blue:#2f4b7c;
    --blue-dark:#243a61;
    --red:#c0392b;
    --border:#d9dee8;
    --bg:#ffffff;
    --muted:#6b7488;
    --card-shadow:0 1px 3px rgba(31,45,77,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--navy);
    padding:40px 16px 80px;
  }
  .wrap{max-width:800px;margin:0 auto}
  h1{font-size:28px;font-weight:700;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
  .sub b{color:var(--navy)}

  .panel{
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin-bottom:22px;
    box-shadow:var(--card-shadow);
  }
  .panel-title{
    font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--blue);margin-bottom:12px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{
    flex:1;min-width:160px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    color:var(--navy);
  }
  input[type=text]:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}

  button{
    border:none;border-radius:8px;
    padding:10px 18px;
    font-size:14px;font-weight:600;
    cursor:pointer;
  }
  .btn-blue{background:var(--blue);color:#fff}
  .btn-blue:hover{background:var(--blue-dark)}
  .btn-ghost{background:transparent;color:var(--blue);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--blue)}
  .btn-del{background:transparent;color:var(--red);font-weight:600;padding:6px 10px}
  .btn-del:hover{text-decoration:underline}
  .btn-sm{padding:7px 14px;font-size:13px}
  button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

  .search{width:100%;margin-bottom:22px}

  /* ===== Tầng 1: Khóa học ===== */
  .course{
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:14px;
    box-shadow:var(--card-shadow);
    overflow:hidden;
  }
  .course-head{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .course-head:hover{background:#f6f8fb}
  .num{color:var(--muted);font-size:13px;min-width:20px;text-align:right}
  .caret{
    width:0;height:0;
    border-left:6px solid var(--blue);
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    transition:transform .15s;
    flex-shrink:0;
  }
  .open > .course-head .caret,
  .open > .group-head .caret{transform:rotate(90deg)}
  .course-name{font-weight:700;font-size:16px;flex:1}
  .badge{
    font-size:12px;color:var(--blue);
    background:#eef2f9;
    border-radius:999px;
    padding:3px 10px;
    white-space:nowrap;
  }
  .course-body{display:none;border-top:1px solid var(--border);padding:14px 16px 16px}
  .course.open > .course-body{display:block}

  /* ===== Tầng 2: Phần ===== */
  .group{
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:10px;
    background:#fbfcfe;
    overflow:hidden;
  }
  .group-head{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;
    cursor:pointer;
    user-select:none;
  }
  .group-head:hover{background:#f2f5fa}
  .group-name{font-weight:600;font-size:14.5px;flex:1;color:var(--navy)}
  .group-body{display:none;border-top:1px solid var(--border);padding:10px 14px 14px;background:#fff}
  .group.open > .group-body{display:block}

  /* ===== Tầng 3: Link ===== */
  .link-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 0;
    border-bottom:1px solid #eef1f6;
  }
  .link-item:last-of-type{border-bottom:none}
  .link-num{color:var(--muted);font-size:13px;min-width:20px;text-align:right;padding-top:2px}
  .link-info{flex:1;min-width:0}
  .link-info a{color:var(--navy);font-weight:600;font-size:14px;text-decoration:none}
  .link-info a:hover{color:var(--blue);text-decoration:underline}
  .link-url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:2px}

  .addbox{
    margin-top:12px;padding-top:12px;
    border-top:1px dashed var(--border);
  }
  .actions{margin-top:10px;text-align:right}

  .toolbar{
    display:flex;gap:10px;justify-content:flex-end;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .empty{
    text-align:center;color:var(--muted);
    padding:30px 0;font-size:14px;
  }
  @media (max-width:560px){
    .row{flex-direction:column}
    button{width:100%}
    .btn-del{width:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Thư viện khóa học</h1>
  <p class="sub"><b id="statCourses">0</b> khóa · <b id="statGroups">0</b> phần · <b id="statLinks">0</b> link · bấm tên để mở</p>

  <div class="panel">
    <div class="panel-title">Thêm khóa học</div>
    <div class="row">
      <input type="text" id="newCourseName" placeholder="Tên khóa học (vd: Blender cơ bản)">
      <button class="btn-blue" onclick="addCourse()">Thêm khóa</button>
    </div>
  </div>

  <input type="text" class="search" id="searchBox" placeholder="Tìm nhanh khóa, phần hoặc bài học..." oninput="render()">

  <div class="toolbar">
    <button class="btn-ghost" onclick="exportJSON()">Xuất file sao lưu (.json)</button>
    <button class="btn-ghost" onclick="document.getElementById('importFile').click()">Nhập file sao lưu</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>

  <div id="courseList"></div>
</div>

<script>
const STORE_KEY = "thuVienKhoaHoc_v1";
let data = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return [];
    let parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return [];
    // Di chuyển dữ liệu từ bản cũ (khóa → link) sang bản mới (khóa → phần → link)
    parsed.forEach(c => {
      if(!Array.isArray(c.groups)){
        c.groups = [];
        if(Array.isArray(c.links) && c.links.length > 0){
          c.groups.push({ id: Date.now() + Math.floor(Math.random()*1000), name: "Danh sách bài", open: true, links: c.links });
        }
        delete c.links;
      }
    });
    return parsed;
  }catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
function findCourse(cid){ return data.find(x => x.id === cid); }
function findGroup(cid, gid){
  const c = findCourse(cid);
  return c ? c.groups.find(g => g.id === gid) : null;
}
function newId(){ return Date.now() + Math.floor(Math.random()*1000); }

/* ===== Tầng 1: Khóa học ===== */
function addCourse(){
  const inp = document.getElementById("newCourseName");
  const name = inp.value.trim();
  if(!name){ alert("Nhập tên khóa học trước đã."); return; }
  data.push({ id: newId(), name: name, open: true, groups: [] });
  inp.value = "";
  save(); render();
}
function deleteCourse(cid){
  const c = findCourse(cid);
  if(!c) return;
  const total = c.groups.reduce((s,g) => s + g.links.length, 0);
  if(!confirm('Xóa khóa "' + c.name + '" gồm ' + c.groups.length + ' phần và ' + total + ' link?')) return;
  data = data.filter(x => x.id !== cid);
  save(); render();
}
function renameCourse(cid){
  const c = findCourse(cid);
  if(!c) return;
  const name = prompt("Tên mới cho khóa học:", c.name);
  if(name && name.trim()){ c.name = name.trim(); save(); render(); }
}
function toggleCourse(cid){
  const c = findCourse(cid);
  if(!c) return;
  c.open = !c.open;
  save(); render();
}

/* ===== Tầng 2: Phần ===== */
function addGroup(cid){
  const c = findCourse(cid);
  if(!c) return;
  const inp = document.getElementById("groupName-" + cid);
  const name = inp.value.trim();
  if(!name){ alert("Nhập tên phần trước đã."); return; }
  c.groups.push({ id: newId(), name: name, open: true, links: [] });
  inp.value = "";
  save(); render();
}
function deleteGroup(cid, gid){
  const c = findCourse(cid);
  const g = findGroup(cid, gid);
  if(!c || !g) return;
  if(!confirm('Xóa phần "' + g.name + '" và ' + g.links.length + ' link bên trong?')) return;
  c.groups = c.groups.filter(x => x.id !== gid);
  save(); render();
}
function renameGroup(cid, gid){
  const g = findGroup(cid, gid);
  if(!g) return;
  const name = prompt("Tên mới cho phần này:", g.name);
  if(name && name.trim()){ g.name = name.trim(); save(); render(); }
}
function toggleGroup(cid, gid){
  const g = findGroup(cid, gid);
  if(!g) return;
  g.open = !g.open;
  save(); render();
}

/* ===== Tầng 3: Link ===== */
function addLink(cid, gid){
  const g = findGroup(cid, gid);
  if(!g) return;
  const nameInp = document.getElementById("linkName-" + gid);
  const urlInp  = document.getElementById("linkUrl-" + gid);
  let url = urlInp.value.trim();
  if(!url){ alert("Nhập link trước đã."); return; }
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;
  let title = nameInp.value.trim();
  if(!title){
    try{
      const u = new URL(url);
      const parts = u.pathname.split("/").filter(Boolean);
      title = decodeURIComponent(parts[parts.length - 1] || u.hostname);
      title = title.replace(/[-_]+/g, " ");
    }catch(e){ title = url; }
  }
  g.links.push({ id: newId(), title: title, url: url });
  nameInp.value = ""; urlInp.value = "";
  save(); render();
}
function deleteLink(cid, gid, lid){
  const g = findGroup(cid, gid);
  if(!g) return;
  g.links = g.links.filter(l => l.id !== lid);
  save(); render();
}

/* ===== Sao lưu ===== */
function exportJSON(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = "thu-vien-khoa-hoc-" + d.toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error("Sai định dạng");
      if(!confirm("Nhập " + imported.length + " khóa học từ file? Dữ liệu hiện tại sẽ bị thay thế.")) return;
      // Cho phép nhập cả file sao lưu bản cũ
      imported.forEach(c => {
        if(!Array.isArray(c.groups)){
          c.groups = [];
          if(Array.isArray(c.links) && c.links.length > 0){
            c.groups.push({ id: newId(), name: "Danh sách bài", open: true, links: c.links });
          }
          delete c.links;
        }
      });
      data = imported;
      save(); render();
    }catch(err){
      alert("File không đúng định dạng sao lưu của trang này.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

/* ===== Hiển thị ===== */
function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function render(){
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const list = document.getElementById("courseList");
  let html = "";
  let shownCourses = 0;

  data.forEach((c, ci) => {
    const matchCourse = c.name.toLowerCase().includes(q);
    // Lọc theo từ khóa: giữ phần khớp tên, hoặc phần có link khớp
    let groups = c.groups;
    if(q && !matchCourse){
      groups = c.groups
        .map(g => {
          if(g.name.toLowerCase().includes(q)) return g;
          const links = g.links.filter(l =>
            l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q));
          return links.length ? Object.assign({}, g, {links: links}) : null;
        })
        .filter(Boolean);
      if(groups.length === 0) return;
    }
    shownCourses++;
    const totalLinks = c.groups.reduce((s,g) => s + g.links.length, 0);
    const courseOpen = q ? true : c.open;

    html += '<div class="course' + (courseOpen ? " open" : "") + '">'
      + '<div class="course-head" onclick="toggleCourse(' + c.id + ')">'
      +   '<span class="num">' + (ci+1) + '</span>'
      +   '<span class="caret"></span>'
      +   '<span class="course-name">' + esc(c.name) + '</span>'
      +   '<span class="badge">' + c.groups.length + ' phần · ' + totalLinks + ' link</span>'
      + '</div>'
      + '<div class="course-body">';

    if(groups.length === 0){
      html += '<div class="empty" style="padding:12px 0">Chưa có phần nào. Thêm phần đầu tiên ở ô dưới.</div>';
    }

    groups.forEach((g, gi) => {
      const groupOpen = q ? true : g.open;
      html += '<div class="group' + (groupOpen ? " open" : "") + '">'
        + '<div class="group-head" onclick="toggleGroup(' + c.id + ',' + g.id + ')">'
        +   '<span class="num">' + (gi+1) + '</span>'
        +   '<span class="caret"></span>'
        +   '<span class="group-name">' + esc(g.name) + '</span>'
        +   '<span class="badge">' + g.links.length + ' link</span>'
        + '</div>'
        + '<div class="group-body">';

      if(g.links.length === 0){
        html += '<div class="empty" style="padding:10px 0">Chưa có link nào trong phần này.</div>';
      }else{
        g.links.forEach((l, li) => {
          html += '<div class="link-item">'
            + '<span class="link-num">' + (li+1) + '</span>'
            + '<div class="link-info">'
            +   '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.title) + '</a>'
            +   '<div class="link-url">' + esc(l.url) + '</div>'
            + '</div>'
            + '<button class="btn-del" onclick="deleteLink(' + c.id + ',' + g.id + ',' + l.id + ')">Xóa</button>'
            + '</div>';
        });
      }

      html += '<div class="addbox">'
        + '<div class="row">'
        +   '<input type="text" id="linkName-' + g.id + '" placeholder="Tên bài (vd: Bài 1 – Giao diện)">'
        +   '<input type="text" id="linkUrl-' + g.id + '" placeholder="https://...">'
        +   '<button class="btn-blue btn-sm" onclick="addLink(' + c.id + ',' + g.id + ')">Thêm link</button>'
        + '</div>'
        + '<div class="hint">Bỏ trống ô tên thì trang tự lấy tên từ link.</div>'
        + '</div>'
        + '<div class="actions">'
        +   '<button class="btn-ghost btn-sm" onclick="renameGroup(' + c.id + ',' + g.id + ')">Đổi tên phần</button> '
        +   '<button class="btn-del" onclick="deleteGroup(' + c.id + ',' + g.id + ')">Xóa phần</button>'
        + '</div>'
        + '</div></div>';
    });

    // Thêm phần mới vào khóa
    html += '<div class="addbox">'
      + '<div class="row">'
      +   '<input type="text" id="groupName-' + c.id + '" placeholder="Tên phần mới (vd: Chương 1, Phần cơ bản...)">'
      +   '<button class="btn-blue btn-sm" onclick="addGroup(' + c.id + ')">Thêm phần</button>'
      + '</div>'
      + '</div>'
      + '<div class="actions">'
      +   '<button class="btn-ghost btn-sm" onclick="renameCourse(' + c.id + ')">Đổi tên khóa</button> '
      +   '<button class="btn-del" onclick="deleteCourse(' + c.id + ')">Xóa khóa</button>'
      + '</div>'
      + '</div></div>';
  });

  if(data.length === 0){
    html = '<div class="empty">Chưa có khóa học nào. Thêm khóa đầu tiên ở ô phía trên.</div>';
  }else if(shownCourses === 0){
    html = '<div class="empty">Không tìm thấy gì khớp với "' + esc(q) + '".</div>';
  }

  list.innerHTML = html;

  let totalGroups = 0, totalLinks = 0;
  data.forEach(c => {
    totalGroups += c.groups.length;
    c.groups.forEach(g => totalLinks += g.links.length);
  });
  document.getElementById("statCourses").textContent = data.length;
  document.getElementById("statGroups").textContent = totalGroups;
  document.getElementById("statLinks").textContent = totalLinks;
}

/* Enter để thêm nhanh */
document.getElementById("newCourseName").addEventListener("keydown", e => {
  if(e.key === "Enter") addCourse();
});
document.addEventListener("keydown", e => {
  const id = e.target.id || "";
  if(e.key !== "Enter") return;
  if(id.startsWith("linkUrl-")){
    const gid = Number(id.replace("linkUrl-",""));
    const c = data.find(c => c.groups.some(g => g.id === gid));
    if(c) addLink(c.id, gid);
  }else if(id.startsWith("groupName-")){
    addGroup(Number(id.replace("groupName-","")));
  }
});

render();
</script>
</body>
</html>
